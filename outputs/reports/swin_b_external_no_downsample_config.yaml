project:
  name: skinclassification
  seed: 42
  num_classes: 5
  class_names:
  - acne
  - eczema
  - dermatitis
  - pigmentation
  - others
paths:
  raw_dir: data/raw
  processed_image_dir: data/processed/images
  interim_dir: data/interim
  manifest: data/interim/split_samples.csv
  outputs_dir: outputs
  checkpoints_dir: outputs/checkpoints
  logs_dir: outputs/logs
  figures_dir: outputs/figures
  gradcam_dir: outputs/gradcam
  feature_maps_dir: outputs/feature_maps
  error_cases_dir: outputs/error_cases
  reports_dir: outputs/reports
data:
  image_size: 224
  min_size: 64
  val_ratio: 0.15
  test_ratio: 0.15
  duplicate_policy: first
  use_sources:
  - dermnet
  - skindisnet
  - mendeley
  - scin
  split_external_sources:
  - scin
  max_samples_per_class: null
  downsample_majority:
    enabled: false
    label: others
    max_per_source: 3000
    skip_external_sources: true
  num_workers: 0
augmentation:
  random_resized_crop_scale:
  - 0.75
  - 1.0
  horizontal_flip_p: 0.5
  color_jitter:
    brightness: 0.18
    contrast: 0.18
    saturation: 0.12
    hue: 0.03
  random_rotation_degrees: 12
  random_erasing_p: 0.15
  background_perturb_p: 0.25
training:
  model: swin_b
  pretrained: true
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  balance_strategy: weighted_sampler
  loss_class_weights: false
  scheduler: cosine
  early_stopping_patience: 8
  amp: true
models:
  supported:
  - resnet18
  - densenet121
  - efficientnet_b0
  - mobilenet_v3_small
  - convnext_tiny
  - convnext_base
  - swin_s
  - swin_b
  server_preferred:
  - convnext_tiny
  - convnext_base
  - swin_s
  - swin_b
evaluation:
  primary_metric: macro_f1
  confidence_threshold: 0.6
  calibration_bins: 10
