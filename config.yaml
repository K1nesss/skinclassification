project:
  name: skinclassification
  seed: 42
  num_classes: 10
  class_names:
    - acne_rosacea
    - eczema
    - dermatitis
    - pigmentation_disorder
    - vitiligo
    - nail_psoriasis
    - psoriasis_lichen_planus
    - fungal_infection
    - seborrheic_keratosis_benign_tumor
    - viral_warts

paths:
  raw_dir: data/raw
  new_dir: data/new
  pass_dir: data/pass
  processed_image_dir: data/processed
  interim_dir: data/interim
  manifest: data/interim/split_samples.csv
  outputs_dir: outputs
  checkpoints_dir: outputs/checkpoints
  logs_dir: outputs/logs
  figures_dir: outputs/figures
  gradcam_dir: outputs/gradcam
  feature_maps_dir: outputs/feature_maps
  error_cases_dir: outputs/error_cases
  reports_dir: outputs/reports

data:
  image_size: 384
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 0

data_quality:
  min_size: 64
  black_ratio_threshold: 0.35
  dark_mean_threshold: 35.0
  dark_ratio_threshold: 0.65
  bright_mean_threshold: 235.0
  bright_ratio_threshold: 0.65
  blur_laplacian_threshold: 18.0
  mosaic_block_ratio_threshold: 1.9
  mosaic_boundary_threshold: 7.0
  lesion_edge_density_threshold: 0.010
  lesion_saturation_std_threshold: 10.0
  save_max_side: 0
  jpeg_quality: 95
  max_visual_pages_per_reason: null

augmentation:
  random_resized_crop_scale: [0.75, 1.0]
  horizontal_flip_p: 0.5
  color_jitter:
    brightness: 0.18
    contrast: 0.18
    saturation: 0.12
    hue: 0.03
  random_rotation_degrees: 12
  random_erasing_p: 0.15
  background_perturb_p: 0.25

training:
  model: densenet121
  pretrained: true
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  balance_strategy: class_aware_sampler
  hard_classes:
    - eczema
    - dermatitis
    - psoriasis_lichen_planus
  hard_class_multiplier: 1.5
  loss_class_weights: false
  scheduler: cosine
  early_stopping_patience: 8
  amp: true

models:
  supported:
    - resnet18
    - densenet121
    - efficientnet_b0
    - mobilenet_v3_small
    - convnext_tiny
    - convnext_base
    - swin_s
    - swin_b
  server_preferred:
    - convnext_tiny
    - convnext_base
    - swin_s
    - swin_b

evaluation:
  primary_metric: macro_f1
  confidence_threshold: 0.6
  calibration_bins: 10
